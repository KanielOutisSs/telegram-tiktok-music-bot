services:
  - type: web
    name: telegram-tiktok-music-bot
    runtime: docker
    plan: free
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: MAX_OUTPUT_MB
        value: "45"
      - key: WEB_APP_URL
        value: "https://telegram-tiktok-music-bot.onrender.com/webapp/"
